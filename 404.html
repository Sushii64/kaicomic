<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // Redirect to index.html and preserve the path as a hash
    // This allows the single-page app to handle the route
    const path = window.location.pathname;
    if (path !== '/' && path !== '/index.html') {
      window.location.replace('/#' + path);
    } else {
      window.location.replace('/');
    }
  </script>
</head>
<body>
  <p>Redirecting...</p>
</body>
</html>
